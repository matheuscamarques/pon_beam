<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="320" height="240" fill="none"/>
  <style>
    .ring { fill:none; stroke:#8B6914; stroke-width:0.5; opacity:0.6; }
    .ring-inner { fill:none; stroke:#FFD700; stroke-width:0.8; opacity:0.8; }
    .core { fill:#FFD700; opacity:0.9; }
    .core-glow { fill:#FFD700; opacity:0.15; }
    .ray { stroke:#8B6914; stroke-width:0.4; opacity:0.3; }
    .ray-strong { stroke:#FFD700; stroke-width:0.5; opacity:0.5; }
    .particle { fill:#8B6914; opacity:0.5; }
  </style>

  <!-- outer rings -->
  <circle class="ring" cx="160" cy="120" r="108"/>
  <circle class="ring" cx="160" cy="120" r="96"/>
  <circle class="ring-inner" cx="160" cy="120" r="84"/>
  <circle class="ring" cx="160" cy="120" r="72"/>
  <circle class="ring-inner" cx="160" cy="120" r="60"/>

  <!-- rays radiating outward -->
  <g>
    <line class="ray" x1="160" y1="120" x2="160" y2="12"/>
    <line class="ray-strong" x1="160" y1="120" x2="212" y2="22"/>
    <line class="ray" x1="160" y1="120" x2="252" y2="52"/>
    <line class="ray-strong" x1="160" y1="120" x2="268" y2="96"/>
    <line class="ray" x1="160" y1="120" x2="268" y2="144"/>
    <line class="ray-strong" x1="160" y1="120" x2="252" y2="188"/>
    <line class="ray" x1="160" y1="120" x2="212" y2="218"/>
    <line class="ray-strong" x1="160" y1="120" x2="160" y2="228"/>
    <line class="ray" x1="160" y1="120" x2="108" y2="218"/>
    <line class="ray-strong" x1="160" y1="120" x2="68" y2="188"/>
    <line class="ray" x1="160" y1="120" x2="52" y2="144"/>
    <line class="ray-strong" x1="160" y1="120" x2="52" y2="96"/>
    <line class="ray" x1="160" y1="120" x2="68" y2="52"/>
    <line class="ray-strong" x1="160" y1="120" x2="108" y2="22"/>
  </g>

  <!-- inner rings -->
  <circle class="ring" cx="160" cy="120" r="48"/>
  <circle class="ring-inner" cx="160" cy="120" r="36"/>

  <!-- core glow -->
  <circle class="core-glow" cx="160" cy="120" r="20"/>
  <circle class="core-glow" cx="160" cy="120" r="14"/>

  <!-- core dot -->
  <circle class="core" cx="160" cy="120" r="5"/>

  <!-- scattered particles -->
  <circle class="particle" cx="140" cy="38" r="1.5"/>
  <circle class="particle" cx="230" cy="70" r="1.2"/>
  <circle class="particle" cx="245" cy="160" r="1.5"/>
  <circle class="particle" cx="90" cy="190" r="1.2"/>
  <circle class="particle" cx="78" cy="55" r="1"/>
  <circle class="particle" cx="195" cy="210" r="1.3"/>
  <circle class="particle" cx="115" cy="35" r="1"/>
  <circle class="particle" cx="240" cy="130" r="0.8"/>
</svg>
