<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="none"/>
  <style>
    .node { fill: #21262d; stroke: #30363d; stroke-width: 1.5; }
    .node-pulse { fill: #161b22; stroke: #3fb950; stroke-width: 2; }
    .edge { stroke: #3fb950; stroke-width: 1.5; fill: none; }
    .edge-blue { stroke: #58a6ff; stroke-width: 1.5; fill: none; }
    .label { fill: #8b949e; font-family: monospace; font-size: 9px; text-anchor: middle; }
    .label-light { fill: #e6edf3; font-family: sans-serif; font-size: 10px; text-anchor: middle; font-weight: 600; }
  </style>

  <!-- FBE -->
  <rect class="node" x="20" y="75" width="60" height="50" rx="0"/>
  <text class="label-light" x="50" y="102">FBE</text>
  <text class="label" x="50" y="115">Processo</text>

  <!-- Premise -->
  <rect class="node" x="130" y="20" width="60" height="50" rx="0"/>
  <text class="label-light" x="160" y="47">Premise</text>

  <!-- Condition -->
  <rect class="node-pulse" x="130" y="130" width="60" height="50" rx="0"/>
  <text class="label-light" x="160" y="157">Condition</text>

  <!-- Action -->
  <rect class="node" x="240" y="75" width="60" height="50" rx="0"/>
  <text class="label-light" x="270" y="102">Action</text>

  <!-- edges -->
  <line class="edge" x1="80" y1="90" x2="130" y2="45" marker-end="url(#arrow)"/>
  <line class="edge" x1="80" y1="110" x2="130" y2="155" marker-end="url(#arrow)"/>
  <line class="edge" x1="160" y1="70" x2="160" y2="130" marker-end="url(#arrow)"/>
  <line class="edge-blue" x1="190" y1="100" x2="240" y2="100" marker-end="url(#arrow2)"/>
  <line class="edge" x1="270" y1="125" x2="270" y2="90" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path class="edge" d="M 270 75 Q 270 10 50 10 Q 20 10 20 75" stroke-dasharray="3,3"/>

  <!-- labels -->
  <text class="label" x="105" y="60">notifica</text>
  <text class="label" x="105" y="140">notifica</text>
  <text class="label" x="215" y="105">dispara</text>
  <text class="label" x="280" y="115">altera</text>

  <!-- cycle indicator -->
  <circle cx="295" cy="15" r="12" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M 292 10 L 295 6 L 298 10" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text class="label" x="295" y="22" font-size="7">ciclo</text>
</svg>
