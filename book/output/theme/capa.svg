<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreSolid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <filter id="glowBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="320" height="240" fill="none"/>

  <style>
    .scene {
      transform-origin: 160px 120px;
      perspective: 800px;
      transform-style: preserve-3d;
    }

    .orbit-group {
      transform-origin: 160px 120px;
      transform-style: preserve-3d;
      animation: spinY 25s linear infinite;
    }

    .ring-tilt-1 {
      transform-origin: 160px 120px;
      transform-style: preserve-3d;
      transform: rotateX(72deg);
      animation: spinSelf 18s linear infinite reverse;
    }
    .ring-tilt-2 {
      transform-origin: 160px 120px;
      transform-style: preserve-3d;
      transform: rotateX(-54deg);
      animation: spinSelf 22s linear infinite;
    }
    .ring-tilt-3 {
      transform-origin: 160px 120px;
      transform-style: preserve-3d;
      transform: rotateX(36deg);
      animation: spinSelf 28s linear infinite reverse;
    }
    .ring-tilt-4 {
      transform-origin: 160px 120px;
      transform-style: preserve-3d;
      transform: rotateX(-18deg);
      animation: spinSelf 32s linear infinite;
    }
    .ring-tilt-5 {
      transform-origin: 160px 120px;
      transform-style: preserve-3d;
      transform: rotateX(0deg);
      animation: spinSelf 15s linear infinite reverse;
    }

    .ring {
      fill: none;
      stroke: #8B6914;
      stroke-width: 0.6;
    }
    .ring-bright {
      fill: none;
      stroke: #FFD700;
      stroke-width: 0.8;
    }
    .ring-thin {
      fill: none;
      stroke: #8B6914;
      stroke-width: 0.3;
      opacity: 0.5;
    }

    .particle-orbit {
      transform-origin: 160px 120px;
      animation: spinSelf 6s linear infinite;
    }
    .particle-orbit-reverse {
      transform-origin: 160px 120px;
      animation: spinSelf 8s linear infinite reverse;
    }

    .dot { fill: #FFD700; }
    .dot-dim { fill: #8B6914; }

    @keyframes spinY {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
    @keyframes spinSelf {
      from { transform: rotateX(var(--tx, 0deg)) rotateY(0deg); }
      to { transform: rotateX(var(--tx, 0deg)) rotateY(360deg); }
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }
    @keyframes coreSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .core-outer { animation: corePulse 3s ease-in-out infinite; transform-origin: 160px 120px; }
    .glow-outer { animation: glowPulse 3s ease-in-out infinite; transform-origin: 160px 120px; }
    .core-spin { animation: coreSpin 12s linear infinite; transform-origin: 160px 120px; }
  </style>

  <g class="scene">

    <!-- glow background -->
    <circle class="glow-outer" cx="160" cy="120" r="45" fill="url(#coreGlow)" filter="url(#glowBlur)"/>

    <g class="orbit-group">

      <!-- ring 5: equatorial (0) -->
      <g class="ring-tilt-5">
        <ellipse class="ring-bright" cx="160" cy="120" rx="95" ry="95"/>
        <g class="particle-orbit">
          <circle class="dot" cx="255" cy="120" r="2"/>
          <circle class="dot-dim" cx="65" cy="120" r="1.5"/>
        </g>
      </g>

      <!-- ring 4: slight tilt (-18) -->
      <g class="ring-tilt-4">
        <ellipse class="ring" cx="160" cy="120" rx="110" ry="110"/>
        <g class="particle-orbit-reverse">
          <circle class="dot-dim" cx="270" cy="120" r="1.5"/>
          <circle class="dot" cx="50" cy="120" r="1.8"/>
        </g>
      </g>

      <!-- ring 3: medium tilt (36) -->
      <g class="ring-tilt-3">
        <ellipse class="ring" cx="160" cy="120" rx="80" ry="80"/>
        <g class="particle-orbit">
          <circle class="dot" cx="240" cy="120" r="1.5"/>
          <circle class="dot-dim" cx="80" cy="120" r="1.2"/>
        </g>
      </g>

      <!-- ring 2: steep tilt (-54) -->
      <g class="ring-tilt-2">
        <ellipse class="ring-thin" cx="160" cy="120" rx="118" ry="118"/>
        <g class="particle-orbit-reverse">
          <circle class="dot" cx="278" cy="120" r="1.2"/>
          <circle class="dot-dim" cx="42" cy="120" r="1"/>
        </g>
      </g>

      <!-- ring 1: steepest tilt (72) -->
      <g class="ring-tilt-1">
        <ellipse class="ring-thin" cx="160" cy="120" rx="70" ry="70"/>
        <g class="particle-orbit">
          <circle class="dot" cx="230" cy="120" r="1.2"/>
          <circle class="dot-dim" cx="90" cy="120" r="1"/>
        </g>
      </g>

    </g>

    <!-- inner bright ring spinning independently -->
    <g class="core-spin">
      <ellipse class="ring-bright" cx="160" cy="120" rx="22" ry="22" transform="rotate(15 160 120)" opacity="0.6"/>
    </g>
    <g class="core-spin" style="animation-delay:-6s">
      <ellipse class="ring" cx="160" cy="120" rx="14" ry="14" transform="rotate(-25 160 120)" opacity="0.5"/>
    </g>

    <!-- core glow -->
    <circle class="glow-outer" cx="160" cy="120" r="18" fill="url(#coreGlow)" filter="url(#glowBlur)"/>

    <!-- core body -->
    <circle class="core-outer" cx="160" cy="120" r="6" fill="url(#coreSolid)"/>

  </g>
</svg>
