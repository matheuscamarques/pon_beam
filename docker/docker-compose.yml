# PON-BEAM Benchmark — Docker Compose
#
# Uso:
#   docker compose build    # Constrói (leva ~30 min)
#   docker compose up       # Executa benchmarks
#   docker compose down     # Limpa container

services:
  bench:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pon-beam-bench:latest
    container_name: pon-beam-results
    volumes:
      - ./results:/pon-beam/harness/results/latest
