# PON-BEAM Benchmark — Docker Compose
#
# Uso:
#   docker compose up --build   # Constrói imagens + executa benchmarks
#   docker compose run --rm bench   # Só executa (se j construído)
#
# Resultados salvos em ./results/

services:
  bench:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pon-beam-bench:latest
    container_name: pon-beam-bench
    volumes:
      - ./results:/pon-beam/harness/results/latest
      - ./report:/pon-beam/harness/report
    environment:
      - OTP_BASELINE_ROOT=/opt/erlang/30-stock
      - OTP_PONBEAM_ROOT=/opt/erlang/30-pon
