\* PremiseMatch.cfg — Configuração TLC para PremiseMatch.tla
\*
\* Instância concreta:
\*   Patterns  = {"ping", "pong"}
\*   Terms     = mensagens que podem ser enviadas
\*   MatchTable = compatibilidade pattern-termo

CONSTANTS
    Ids = {1, 2, 3, 4}
    Patterns = {"ping", "pong"}
    Terms = {"ping", "pong", "hello", "ping-payload", "pong-payload"}

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    PremiseSound
    NoMessageLoss
    NoDuplicateConsumption