\* TriColorGC.cfg — Configuração TLC para TriColorGC.tla
\*
\* Heap de 4 objetos, 1 raiz:
\*   root(1) -> 2
\*   2       -> 3
\*   3       -> (sem filhos)
\*   4       -> (sem filhos; lixo não alcançado)
\* Assim 4 é coletável, 1/2/3 são vivos.

CONSTANTS
    Objects = {1, 2, 3, 4}
    Roots = {1}
    MaxSteps = 6

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    NoBlackToWhite
    RootsSafe
    NoLiveCollect
    WhiteCollectOnly